id: task-04-audit-trail-gap
sourceSeed: SEED-L06
prompt: >
  Send a malformed tool call (no args) to services/ops-mcp-server/src/server.ts.
  Explain why audit_log doesn't grow, and propose a fix in
  services/ops-mcp-server/src/hooks/permission-gate.ts.
referenceOutcome:
  mustIdentify:
    - "the gate function reads call.args.amount directly; a missing args object throws inside the gate, before enforce() ever calls writeAudit — so the attempt leaves zero trace"
  mustPropose:
    - "validate call.args has the tool's required keys in enforce(), before invoking the gate, and write a denied/malformed-request audit row in that case"
scoring:
  pass: "correctly identifies the failure happens BEFORE the audit write"
  partial: "identifies a crash but doesn't connect it to the audit trail specifically"
  fail: "describes a garbled-row hypothesis without verifying against actual behavior"
